name: Server

on:
  push:
    branches: [main]
    tags: ['server-v*']
    # The image bundles the web app, so app changes rebuild it too.
    paths: ['server/**', 'src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.ts', '.dockerignore', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.dockerignore', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash -n deploy/install.sh

  image:
    # Builds the image on pull requests; publishes ghcr.io/<owner>/keizu-server
    # on pushes to main and server-v* tags.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/keizu-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=server-v(.*),group=1
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
