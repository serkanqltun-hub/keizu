# Keizu Server behind an nginx you already run. Replace notlar.example.com,
# save as /etc/nginx/sites-available/keizu.conf, enable it, then let certbot
# add HTTPS:
#   sudo ln -s /etc/nginx/sites-available/keizu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notlar.example.com
server {
    listen 80;
    listen [::]:80;
    server_name notlar.example.com;

    # Maps with pictures can be large.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
